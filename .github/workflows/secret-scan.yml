# Secret scan over the whole git history (plan M0, data hygiene). The repository is public, so
# every commit matters, not only the latest tree. Uses the same pinned gitleaks as local runs.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - name: Scan every commit with gitleaks
        run: ./scripts/gitleaks git --redact --verbose --no-banner .
