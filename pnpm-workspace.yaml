# Keep pnpm's store and metadata cache inside the repo instead of the user-wide
# ~/Library/pnpm/store and ~/Library/Caches/pnpm shared with other projects (plan §9.2).
# stateDir cannot be set here; scripts/pnpm sets it through the environment.
storeDir: .cache/pnpm-store
cacheDir: .cache/pnpm-cache
updateNotifier: false
saveExact: true
# esbuild's install script only validates the platform binary, which pnpm already installs as an
# optional dependency, so keep it from running.
allowBuilds:
  esbuild: false
